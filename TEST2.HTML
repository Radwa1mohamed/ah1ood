<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
/* =========================================
   🕊️ TESTIMONIAL GALLERY
========================================= */

.testimonial-gallery {
    position: relative;
    width: 100%;
    padding: 5rem 2rem;
    margin: 4rem auto;
    background: linear-gradient(
        135deg,
        #fcf8f5 0%,
        #f8effb 50%,
        #fdf9f6 100%
    );
    overflow: hidden;
    direction: rtl;
}

.testimonial-container {
    max-width: 1200px;
    margin: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3rem;
}

/* Header */

.testimonial-header {
    max-width: 700px;
    text-align: center;
}

.testimonial-label {
    display: inline-block;
    color: #9c27b0;
    font-size: 1rem;
    font-weight: 800;
    margin-bottom: 1rem;
    padding: 0.6rem 1.5rem;
    background: #f3e5f5;
    border-radius: 30px;
}

.testimonial-header h2 {
    font-size: 2.2rem;
    font-weight: 900;
    color: #3b0975;
    line-height: 1.6;
    margin-bottom: 1rem;
}

.testimonial-header p {
    color: #77716f;
    font-size: 1.1rem;
    line-height: 1.9;
}

/* Screens Grid */

.testimonial-grid {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(min(100%, 320px), 1fr)
    );
    gap: 3rem;
    justify-items: center;
    align-items: start;
}

/* Main Card */

.testimonial-card {
    position: relative;
    width: 100%;
    max-width: 440px;
    padding: 12px;
    background: rgba(255,255,255,0.85);
    border: 2px solid #e8c8f0;
    border-radius: 30px;
    box-shadow:
        0 12px 30px rgba(59, 9, 117, 0.09),
        0 3px 10px rgba(156, 39, 176, 0.05);
    transition: all 0.4s ease;
}

/* Screenshot Frame */

.testimonial-screen {
    width: 100%;
    overflow: hidden;
    border-radius: 20px;
    background: #fff;
    line-height: 0;
}

.testimonial-screen img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
    transition: transform 0.5s ease;
}

/* Hover */

.testimonial-card:hover {
    transform: translateY(-8px);
    box-shadow:
        0 20px 40px rgba(59, 9, 117, 0.15);
    border-color: #bd78ce;
}

.testimonial-card:hover .testimonial-screen img {
    transform: scale(1.015);
}

/* Decorative Pigeon */

.testimonial-dove {
    position: absolute;
    width: 85px;
    height: auto;
    object-fit: contain;
    z-index: 5;
    pointer-events: none;
    filter: drop-shadow(
        0 5px 8px rgba(0,0,0,0.15)
    );
    animation: testimonialDoveFloat 3.5s ease-in-out infinite;
}

.dove-right {
    top: -35px;
    right: -35px;
}

.dove-left {
    bottom: 30px;
    left: -35px;
    transform: scaleX(-1);
    animation-delay: 0.8s;
}

@keyframes testimonialDoveFloat {
    0%, 100% {
        translate: 0 0;
    }

    50% {
        translate: 0 -9px;
    }
}

/* Footer Button */

.testimonial-footer {
    text-align: center;
}

.testimonial-add-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 0.9rem 2.2rem;
    color: white;
    text-decoration: none;
    font-weight: 800;
    background: linear-gradient(
        135deg,
        #3b0975,
        #9c27b0
    );
    border-radius: 35px;
    box-shadow: 0 7px 20px rgba(59, 9, 117, 0.2);
    transition: 0.3s ease;
}

.testimonial-add-btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 25px rgba(59, 9, 117, 0.3);
    color: white;
}

/* Responsive */

@media (max-width: 768px) {

    .testimonial-gallery {
        padding: 3.5rem 1.2rem;
    }

    .testimonial-container {
        gap: 2.5rem;
    }

    .testimonial-header h2 {
        font-size: 1.7rem;
    }

    .testimonial-header p {
        font-size: 0.95rem;
    }

    .testimonial-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 2.5rem;
    }

    .testimonial-card {
        max-width: 420px;
    }

    .testimonial-dove {
        width: 65px;
    }

    .dove-right {
        right: -20px;
        top: -25px;
    }

    .dove-left {
        left: -20px;
    }
}

@media (max-width: 480px) {

    .testimonial-gallery {
        padding: 2.5rem 1rem;
    }

    .testimonial-header h2 {
        font-size: 1.4rem;
    }

    .testimonial-card {
        padding: 8px;
        border-radius: 22px;
    }

    .testimonial-screen {
        border-radius: 15px;
    }

    .testimonial-dove {
        width: 55px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .testimonial-dove {
        animation: none;
    }

    .testimonial-card,
    .testimonial-screen img {
        transition: none;
    }
}

    </style>
</head>
