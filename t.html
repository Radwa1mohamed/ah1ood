<!-- بداية شريط الإحصائيات - عهود / حمامة الحرم -->
<div id="pigeon-stats-wrapper" class="w-full flex justify-center my-8">
    <style>
        #pigeon-stats-container {
            --brand-dark-purple: #1e0936;
            --brand-deep-purple: #2b0e4d;
            --brand-accent-purple: #7b2cbf;
            --brand-light-purple: #f3e8ff;
            --brand-text-dark: #1b0a33;
            --brand-text-muted: #5e4b75;
            --card-bg-grad: linear-gradient(135deg, #ffffff 0%, #f9f5fd 60%, #f2e9fc 100%);
            --wing-color-1: rgba(123, 44, 191, 0.12);
            --wing-color-2: rgba(43, 14, 77, 0.08);
            
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            background: var(--card-bg-grad);
            border: 1px solid rgba(123, 44, 191, 0.18);
            box-shadow: 0 20px 40px rgba(30, 9, 54, 0.06);
            position: relative;
            border-radius: 2rem;
            width: 100%;
            max-width: 72rem;
            padding: 2.5rem 1.5rem;
            overflow: visible;
            direction: rtl;
        }

        #pigeon-stats-container *, #pigeon-stats-container *:before, #pigeon-stats-container *:after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        /* أجناب الحاوية الخارجية المصممة على شكل ريشات */
        .ps-feather-wing-left, .ps-feather-wing-right {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 85%;
            pointer-events: none;
            z-index: 5;
            opacity: 0.7;
        }

        .ps-feather-wing-left {
            right: -20px;
        }

        .ps-feather-wing-right {
            left: -20px;
            transform: translateY(-50%) scaleX(-1);
        }

        /* الهيدر والعنوان */
        .ps-header {
            text-align: center;
            margin-bottom: 2.5rem;
            opacity: 0;
            transform: translateY(25px);
            transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ps-header.active {
            opacity: 1;
            transform: translateY(0);
        }

        .ps-title-wrapper {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .ps-title {
            font-size: clamp(1.35rem, 2.5vw, 2.25rem);
            font-weight: 800;
            color: var(--brand-text-dark);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* بوكس الـ 4 سنوات الزجاجي الشفاف */
        .ps-years-badge-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 0.25rem;
        }

        .ps-years-badge {
            background: rgba(123, 44, 191, 0.08);
            color: var(--brand-dark-purple);
            border: 1.5px solid rgba(123, 44, 191, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 6px 16px rgba(43, 14, 77, 0.06);
            border-radius: 1rem;
            padding: 0.2rem 1.25rem;
            font-size: clamp(1.5rem, 3vw, 2.25rem);
            font-weight: 900;
            transition: all 0.3s ease;
        }

        /* شبكة الأرقام (تعديل العرض لتكون عنصرين بجانب بعضهما على الهواتف، و5 أعمدة على الشاشات الكبيرة) */
        .ps-timeline-wrapper {
            position: relative;
            margin-top: 1rem;
        }

        .ps-timeline-track {
            display: none;
        }

        @media (min-width: 768px) {
            .ps-timeline-track {
                display: block;
                position: absolute;
                top: 50%;
                left: 0;
                right: 0;
                transform: translateY(-50%);
                height: 3px;
                background: linear-gradient(90deg, 
                    rgba(123, 44, 191, 0.1) 0%, 
                    var(--brand-accent-purple) 35%, 
                    var(--brand-deep-purple) 70%, 
                    rgba(123, 44, 191, 0.1) 100%);
                z-index: 0;
            }
        }

        .ps-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* اتنين اتنين بالعرض على الموبايل */
            gap: 1.75rem 1rem;
            position: relative;
            z-index: 10;
        }

        /* العنصر الخامس (الأخير) يأخذ العرض كاملاً في السطر الأخير ليصبح شكله متناسقاً ومرتباً */
        .ps-card-item:nth-child(5) {
            grid-column: span 2;
            max-width: 220px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .ps-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 0.75rem;
            }
            .ps-card-item:nth-child(5) {
                grid-column: span 1;
                max-width: none;
                margin: 0;
            }
        }

        .ps-card-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            opacity: 0;
            transform: translateY(25px);
            transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(255, 255, 255, 0.5);
            padding: 1rem 0.5rem;
            border-radius: 1rem;
            border: 1px solid rgba(123, 44, 191, 0.08);
        }

        @media (min-width: 768px) {
            .ps-card-item {
                background: transparent;
                padding: 0;
                border: none;
            }
        }

        .ps-number {
            font-size: clamp(1.5rem, 2.5vw, 2.25rem);
            font-weight: 900;
            color: var(--brand-dark-purple);
            margin-bottom: 0.25rem;
            direction: ltr;
            font-family: sans-serif;
        }

        .ps-feather-node-wrapper {
            display: none;
        }

        @media (min-width: 768px) {
            .ps-feather-node-wrapper {
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0.75rem 0;
                z-index: 10;
            }
        }

        .ps-feather-node {
            width: 20px;
            height: 20px;
            background: #fff;
            border: 3px solid var(--brand-accent-purple);
            border-radius: 50% 0 50% 50%;
            transform: rotate(-45deg);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 10px rgba(123, 44, 191, 0.2);
        }

        .ps-card-item:hover .ps-feather-node {
            transform: rotate(0deg) scale(1.3);
            background: var(--brand-accent-purple);
            border-color: #d8b4fe;
            box-shadow: 0 0 15px rgba(123, 44, 191, 0.4);
        }

        .ps-label {
            color: var(--brand-text-muted);
            font-weight: 700;
            font-size: 0.9rem;
            line-height: 1.4;
            max-width: 150px;
            transition: color 0.3s ease;
        }

        @media (min-width: 768px) {
            .ps-label {
                font-size: 1rem;
            }
        }

        .ps-card-item:hover .ps-label {
            color: var(--brand-accent-purple);
        }

        /* خلفية زخرفية ناعمة داخل الحاوية */
        .ps-bg-pattern {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 15rem;
            height: 15rem;
            pointer-events: none;
            opacity: 0.04;
            color: var(--brand-dark-purple);
        }
    </style>

    <div id="pigeon-stats-container" style="width: 100%;">
        <!-- زخرفة الخلفية -->
        <svg class="ps-bg-pattern" viewBox="0 0 100 100" fill="currentColor">
            <path d="M50 0 C60 30 90 40 100 50 C90 60 60 70 50 100 C40 70 10 60 0 50 C10 40 40 30 50 0 Z" />
        </svg>

        <!-- الجانب الريشي الأيمن للحاوية الخارجية -->
        <svg class="ps-feather-wing-right" viewBox="0 0 50 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 20 C35 40, 50 70, 30 100 C15 120, 40 150, 20 180 C10 160, 5 130, 15 100 C25 70, 10 40, 0 20 Z" fill="rgba(123, 44, 191, 0.12)" />
            <path d="M10 50 C40 70, 45 100, 25 130 C10 150, 30 170, 15 190 C5 170, 0 140, 10 120 C20 100, 15 70, 10 50 Z" fill="rgba(43, 14, 77, 0.08)" />
        </svg>

        <!-- الجانب الريشي الأيسر للحاوية الخارجية -->
        <svg class="ps-feather-wing-left" viewBox="0 0 50 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 20 C35 40, 50 70, 30 100 C15 120, 40 150, 20 180 C10 160, 5 130, 15 100 C25 70, 10 40, 0 20 Z" fill="rgba(123, 44, 191, 0.12)" />
            <path d="M10 50 C40 70, 45 100, 25 130 C10 150, 30 170, 15 190 C5 170, 0 140, 10 120 C20 100, 15 70, 10 50 Z" fill="rgba(43, 14, 77, 0.08)" />
        </svg>

        <!-- الهيدر والعنوان الرئيسي -->
        <div id="ps-statsSection" class="ps-header">
            <div class="ps-title-wrapper">
                <h2 class="ps-title">
                    <span>خبرة ممتدة تصل إلى</span>
                    <div class="ps-years-badge-wrapper">
                        <div class="ps-years-badge">
                            <span class="ps-counter-single" data-target="4">0</span>
                        </div>
                    </div>
                    <span>سنوات</span>
                </h2>
            </div>
        </div>

        <!-- التايم لاين والأرقام (مرتبة اتنين اتنين بالعرض) -->
        <div class="ps-timeline-wrapper">
            <div class="ps-timeline-track"></div>

            <div class="ps-grid">
                <!-- 1. محتوى مطبوعات -->
                <div class="ps-card-item" style="transition-delay: 100ms;">
                    <div class="ps-number">
                        +<span class="ps-counter" data-target="50">0</span>
                    </div>
                    <div class="ps-feather-node-wrapper">
                        <div class="ps-feather-node"></div>
                    </div>
                    <p class="ps-label">محتوى مطبوعات</p>
                </div>

                <!-- 2. قطعة محتوى مرئي ( سكريبت ) -->
                <div class="ps-card-item" style="transition-delay: 200ms;">
                    <div class="ps-number">
                        +<span class="ps-counter" data-target="500">0</span>
                    </div>
                    <div class="ps-feather-node-wrapper">
                        <div class="ps-feather-node"></div>
                    </div>
                    <p class="ps-label">قطعة محتوى مرئي ( سكريبت )</p>
                </div>

                <!-- 3. قطعة محتوى مكتوب -->
                <div class="ps-card-item" style="transition-delay: 300ms;">
                    <div class="ps-number">
                        +<span class="ps-counter" data-target="500">0</span>
                    </div>
                    <div class="ps-feather-node-wrapper">
                        <div class="ps-feather-node"></div>
                    </div>
                    <p class="ps-label">قطعة محتوى مكتوب</p>
                </div>

                <!-- 4. استراتيجية تسويقية بالمحتوى -->
                <div class="ps-card-item" style="transition-delay: 400ms;">
                    <div class="ps-number">
                        +<span class="ps-counter" data-target="30">0</span>
                    </div>
                    <div class="ps-feather-node-wrapper">
                        <div class="ps-feather-node"></div>
                    </div>
                    <p class="ps-label">استراتيجية تسويقية بالمحتوى</p>
                </div>

                <!-- 5. عميل (يأخذ مكاناً متناسقاً في المنتصف بالأسفل) -->
                <div class="ps-card-item" style="transition-delay: 500ms;">
                    <div class="ps-number">
                        +<span class="ps-counter" data-target="100">0</span>
                    </div>
                    <div class="ps-feather-node-wrapper">
                        <div class="ps-feather-node"></div>
                    </div>
                    <p class="ps-label">عميل</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- سكريبت التشغيل المستقل -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const counters = document.querySelectorAll('#pigeon-stats-wrapper .ps-counter, #pigeon-stats-wrapper .ps-counter-single');
        const cardItems = document.querySelectorAll('#pigeon-stats-wrapper .ps-card-item');
        const statsHeader = document.getElementById('ps-statsSection');
        const statsContainer = document.getElementById('pigeon-stats-container');
        
        const animationDuration = 1800;

        const animateCounter = (counter) => {
            const target = +counter.getAttribute('data-target');
            const startTime = performance.now();

            const updateNumber = (currentTime) => {
                const elapsedTime = currentTime - startTime;
                const progress = Math.min(elapsedTime / animationDuration, 1);
                
                const easeOutQuad = progress * (2 - progress);
                const currentCount = Math.floor(easeOutQuad * target);

                    counter.innerText = currentCount;

                if (progress < 1) {
                    requestAnimationFrame(updateNumber);
                } else {
                    counter.innerText = target;
                }
            };

            requestAnimationFrame(updateNumber);
        };

        let animated = false;

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && !animated) {
                    if (statsHeader) statsHeader.classList.add('active');
                    cardItems.forEach(el => el.classList.add('active'));
                    counters.forEach(counter => animateCounter(counter));
                    animated = true;
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.2 });

        if (statsContainer) {
            observer.observe(statsContainer);
        }
    });
</script>
<!-- نهاية شريط الإحصائيات -->
